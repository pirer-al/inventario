services:
  db:
    image: postgres:16-alpine
    container_name: inventario-db
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: inventariodb
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/inventariodb
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped
    
volumes:
  postgres_data: